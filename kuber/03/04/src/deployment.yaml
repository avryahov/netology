apiVersion: apps/v1
kind: Deployment
metadata:
  name: update-demo
spec:
  replicas: 5
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels: {app: update-demo}
  template:
    metadata:
      labels: {app: update-demo}
    spec:
      containers:
        - name: nginx
          image: nginx:1.19-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 2
            periodSeconds: 2
        - name: multitool
          image: wbitt/network-multitool:alpine-extra
          env: [{name: HTTP_PORT, value: "8080"}]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: update-demo}
spec:
  selector: {app: update-demo}
  ports: [{name: http, port: 80, targetPort: 80}]
