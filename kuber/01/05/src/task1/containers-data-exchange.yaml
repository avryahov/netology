apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange
  labels:
    app: data-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange
  template:
    metadata:
      labels:
        app: data-exchange
    spec:
      containers:
      # Контейнер-писатель: каждые 5 секунд дописывает дату в общий файл
      - name: busybox
        image: busybox
        command: ["/bin/sh", "-c"]
        args: ["while true; do echo $(date) >> /shared/date.log; sleep 5; done"]
        volumeMounts:
        - name: shared-data
          mountPath: /shared
      # Контейнер-читатель: непрерывно читает тот же файл
      - name: multitool
        image: wbitt/network-multitool
        command: ["/bin/sh", "-c"]
        args: ["tail -f /shared/date.log"]
        volumeMounts:
        - name: shared-data
          mountPath: /shared
      volumes:
      # Эфемерное хранилище, живёт в пределах пода и общее для обоих контейнеров
      - name: shared-data
        emptyDir: {}
